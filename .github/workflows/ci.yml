name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsecheck
          POSTGRES_PASSWORD: pulsecheck
          POSTGRES_DB: pulsecheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsecheck"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate:test up
      - run: npm test